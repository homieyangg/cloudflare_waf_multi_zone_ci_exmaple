rules:
# 第零優先：放行你自己信任的 IP（最高優先，跳過後面所有 custom rules + 受管產品）。
# 把下面換成你自己的 server / CI / 監控出口 IP。沒有這條的話，自家流量一旦被下面的
# ASN / UA 規則掃到就會被擋——這是最常見的「自己把自己鎖在外面」。
# （203.0.113.x 是 RFC5737 範例網段，記得換掉。）
- action: skip
  name: Allow Trusted Infrastructure
  expression: (ip.src in {203.0.113.10 203.0.113.11})
  skip_current_ruleset: true
  products:
  - waf
  - bic
  - rateLimit
  - securityLevel
  - uaBlock
  - zoneLockdown
  logging_enabled: true

# 第一優先：阻擋已知惡意 ASN。這條的 expression 會被 update_abuseipdb_asns.py 每次跑時
# 就地重寫（從 AbuseIPDB / 靜態清單），所以這裡放幾個示意值即可。
- action: block
  name: Block Known Bad ASNs (AbuseIPDB)
  expression: (ip.geoip.asnum in {16276 24940 14061 9009})

# 第二優先：放行常見合法服務（只跳過受管產品，後面的 custom block 仍會評估）。
- action: skip
  expression: (cf.client.bot) or (http.user_agent contains "Googlebot") or (http.user_agent contains "Bingbot") or (http.user_agent contains "UptimeRobot") or (http.user_agent contains "Pingdom") or (http.user_agent contains "facebookexternalhit") or (http.user_agent contains "Twitterbot") or (http.user_agent contains "LinkedInBot") or (http.user_agent contains "Discordbot") or (http.user_agent contains "AppleBot")
  name: Allow Essential Legitimate Services
  products:
  - waf
  - bic
  - rateLimit

# 第三優先：擋掃描工具 UA + 常見漏洞路徑探測。依需要增刪。
- action: block
  expression: (http.user_agent contains "sqlmap") or (http.user_agent contains "nikto") or (http.user_agent contains "nmap") or (http.user_agent contains "masscan") or (http.user_agent contains "nuclei") or (http.user_agent eq "") or (http.request.uri.path contains "/.git") or (http.request.uri.path contains "/.env") or (http.request.uri.path contains "/wp-login") or (http.request.uri.path contains "/phpmyadmin") or (http.request.uri.path contains "/.aws") or (http.request.uri.path contains "/.ssh")
  name: Block Malicious Traffic & Exploit Probes

# 第四優先（兜底）：高威脅分數的流量丟 managed challenge。
# 注意：別用「挑戰所有海外流量」那種寫法——對 SPA + API 的站，managed challenge 會卡死
# 前端的 XHR / preflight，等於把海外用戶整個擋掉。用 threat_score 比較安全。
- action: managed_challenge
  expression: (cf.threat_score gt 10)
  name: Challenge High Threat Score Traffic
